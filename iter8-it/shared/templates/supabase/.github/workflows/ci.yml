name: CI

# PRs into dev and main are where changes get checked. Pushes to dev aren't
# re-checked: a merged PR already ran on exactly that code. Pushes to main
# (releases, hotfixes) run once more as a record of what went live.
#
# The quick checks run everywhere. The end-to-end tests (the slow part) run
# on PRs into main, pushes to main, and on demand; for story PRs into dev,
# Build It runs them locally before opening the PR.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A local Supabase built from supabase/migrations (+ seed.sql). This also
      # proves every migration applies cleanly from scratch.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - name: Point the app at it
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY|MAILPIT_URL)=' \
            | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Database types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          diff -q src/lib/supabase/database.types.ts /tmp/database.types.ts \
            || (echo "::error::src/lib/supabase/database.types.ts is out of date. Run: npm run db:types" && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
